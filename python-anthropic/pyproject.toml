[project]
name = "nightward-example-python-anthropic"
version = "0.0.0"
description = "Runnable Nightward + Anthropic example (Python)."
requires-python = ">=3.9"
dependencies = ["nightward", "anthropic", "httpx"]

[project.optional-dependencies]
dev = ["mypy"]

[tool.ruff]
target-version = "py39"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
required-imports = ["from __future__ import annotations"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
