[project]
name = "nightward-example-python-openai"
version = "0.0.0"
description = "Runnable Nightward + OpenAI example (Python)."
requires-python = ">=3.9"
dependencies = ["nightward", "openai", "httpx"]

[project.optional-dependencies]
dev = ["mypy", "pytest"]

[tool.ruff]
target-version = "py39"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
required-imports = ["from __future__ import annotations"]

[tool.mypy]
python_version = "3.10"
# Provider libs may ship without stubs; the Nightward SDK IS typed, so the API usage we care about
# (httpx_client / instrument / actor) is still checked — that's the anti-drift guarantee.
ignore_missing_imports = true
