[project]
name = "nightward-example-python-openai"
version = "0.0.0"
description = "Runnable Nightward + OpenAI example (Python)."
requires-python = ">=3.9"
# openai pinned <2: this example targets the openai 1.x API. openai 3.0.0 changed http_client typing so it no
# longer unifies with httpx.Client (mypy: duplicate httpx/httpx2) — provider drift, not a Nightward change.
dependencies = ["nightward", "openai<2", "httpx"]

[project.optional-dependencies]
dev = ["mypy", "pytest"]

[tool.ruff]
target-version = "py39"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
required-imports = ["from __future__ import annotations"]

[tool.mypy]
python_version = "3.10"
# Provider libs may ship without stubs; the Nightward SDK IS typed, so the API usage we care about
# (httpx_client / instrument / actor) is still checked — that's the anti-drift guarantee.
ignore_missing_imports = true
